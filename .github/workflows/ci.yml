name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      OPENAI_API_KEY: ci-placeholder
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Prisma schema validation
        run: npx prisma validate
      - name: Prisma client generation
        run: npx prisma generate
      - name: Convex code generation
        run: npx convex codegen
      - name: Cloudflare type generation
        run: npm run cloudflare:types
      - name: Typecheck
        run: npm run typecheck
      - name: Convex typecheck
        run: npm run convex:typecheck
      - name: Cloudflare configuration check
        run: npm run cloudflare:check
      - name: Production build
        run: npm run build:cloudflare
